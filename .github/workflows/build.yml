name: Build and release

# Every push is built and tested on a real Mac and a real Windows PC.
# On main, if the version in the VERSION file hasn't been released yet, both apps are
# published together as one GitHub release, and every installed copy picks it up within
# about 12 hours. If either build or launch test fails, nothing is released.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Mac app
        run: ./mac/build.sh "$(tr -d '[:space:]' < VERSION)" "$GITHUB_RUN_NUMBER"

      - name: Check that the Mac app starts and keeps running
        run: |
          "dist/mac/Claude Usage.app/Contents/MacOS/ClaudeUsage" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "The app quit or crashed right after starting."
            exit 1
          fi
          kill "$PID" || true
          echo "The app started and kept running."

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/mac/ClaudeUsage.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the Windows app
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          dotnet publish windows/ClaudeUsage/ClaudeUsage.csproj -c Release -p:Version=$version -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/windows/ClaudeUsage.exe dist/windows/ClaudeUsage-Windows.exe
          Get-Item dist/windows/ClaudeUsage-Windows.exe | Format-List Name, Length

      - name: Check that the Windows app starts and keeps running
        shell: pwsh
        run: |
          $env:CLAUDE_USAGE_SELFTEST = "1"
          $p = Start-Process dist/windows/ClaudeUsage-Windows.exe -PassThru
          Start-Sleep -Seconds 40
          $log = Join-Path $env:LOCALAPPDATA "ClaudeUsage\errors.log"
          if (Test-Path $log) { Get-Content $log }
          $selftest = Join-Path $env:LOCALAPPDATA "ClaudeUsage\selftest.log"
          if (Test-Path $selftest) { Get-Content $selftest } else { Write-Host "(no self-test result written)" }
          if ($p.HasExited) {
            Write-Host "The app quit or crashed right after starting (exit code $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "The app started, drew its panel and menu, and kept running."

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/ClaudeUsage-Windows.exe

  release:
    needs: [mac, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release (only for a new version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
          else
            gh release create "v$VERSION" dist/ClaudeUsage.zip dist/ClaudeUsage-Windows.exe \
              --title "Claude Usage $VERSION" \
              --notes "$(git log -1 --pretty=%B)"
          fi
